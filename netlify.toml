# Publication sur Netlify (offre gratuite) : site statique, aucune étape de construction.
# Les données des élèves ne passent jamais par Netlify : elles restent dans le navigateur.
#
# Branche de production conseillée : « production » (mise à jour une fois par étape),
# pour limiter le nombre de déploiements, décomptés dans le quota mensuel gratuit.

[build]
  publish = "."
  command = ""

[build.environment]
  # Outils de test uniquement : ne rien télécharger sur Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Fichiers du dépôt qui ne font pas partie de l'application : non servis.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/serveur.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Le service worker doit toujours être revérifié pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
